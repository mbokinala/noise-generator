<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4e5e7"><meta name="description" content="Five colors of noise, with a frequency graph, volume control, and sleep timer.">
<title>Noise</title>
<style>
:root{color-scheme:light;--bg:#f4e5e7;--line:#ae868e;--muted:#805760;--ink:#532f39;--accent:#864759;font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);transition:background-color .35s ease,color .25s ease}
::selection{background:var(--accent);color:var(--bg)}
button,input,select{font:inherit}
button,select{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
main{max-width:704px;margin:0 auto;padding:clamp(48px,12vh,120px) 32px 40px}
.colors{display:flex;justify-content:space-between;gap:12px}
.color{display:flex;align-items:center;justify-content:center;width:44px;min-height:44px;padding:8px;background:none;border:0;border-bottom:1px solid transparent;color:var(--muted);font-size:14px;transition:color .2s,border-color .2s}
.color:hover{color:var(--ink)}
.color[aria-pressed=true]{color:var(--ink);border-color:var(--accent)}
.swatch{width:18px;height:18px;flex-shrink:0;border-radius:50%;border:1px solid var(--muted);background:var(--swatch)}
.color[aria-pressed=true] .swatch{outline:1px solid var(--accent);outline-offset:4px}
.player{margin-top:48px}
.viz{margin:0 0 40px}
canvas{width:100%;height:160px;display:block}
.axis{position:relative;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span:nth-child(2){position:absolute;left:56.63%;transform:translateX(-50%)}
.controls{display:flex;align-items:center;gap:28px}
.play{flex-shrink:0;width:48px;height:48px;border:0;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;transition:background .25s,transform .2s}
.play:hover{transform:scale(1.05)}
.play:active{transform:scale(.96)}
.play:disabled{opacity:.5;cursor:wait}
.play svg{width:18px;height:18px}
.volume{flex:1}
.control-icon{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.volume-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
output{font-variant-numeric:tabular-nums}
input[type=range]{appearance:none;width:100%;height:28px;margin:5px 0 0;background:transparent;cursor:pointer;accent-color:var(--accent)}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;margin-top:-5px;background:var(--accent);border-radius:50%}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--accent);border:0;border-radius:50%}
.timer{margin-top:28px;display:flex;justify-content:flex-end;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.timer label{white-space:nowrap}
select{min-height:44px;max-width:140px;border:0;background:transparent;color:var(--ink);cursor:pointer;padding:0 4px;font-size:12px}
#timer-remaining{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-height:16px;margin:8px 0 0}
select option{background:var(--bg);color:var(--ink)}
#error{color:var(--ink);font-size:14px;line-height:1.5}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:480px){main{padding:56px 24px 28px}.colors{gap:8px}.color{font-size:12px;gap:6px}.player{margin-top:36px}canvas{height:150px}.viz{margin-bottom:32px}.controls{gap:22px}.timer{margin-top:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
<div class="colors" role="group" aria-label="Noise color"></div>
<section class="player" aria-label="Noise player">
<span id="status" class="sr-only" aria-live="polite">Ready</span>
<div class="viz"><canvas id="spectrum" role="img" aria-label="Pink noise frequency spectrum"></canvas><div class="axis" aria-hidden="true"><span>20 Hz</span><span>1 kHz</span><span>20 kHz</span></div></div>
<div class="controls"><button class="play" id="play" aria-label="Play noise" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l14-8z"/></svg></button><div class="volume"><label class="volume-label" for="volume" title="Volume"><span class="sr-only">Volume</span><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><output id="volume-value" for="volume">30%</output></label><input id="volume" type="range" min="0" max="100" value="30"></div></div>
<div class="timer"><label for="timer" title="Sleep timer"><span class="sr-only">Sleep timer</span><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6M12 2v3M18 6l1.5-1.5"/></svg></label><select id="timer"><option value="0">Off</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option><option value="120">2 hours</option></select></div>
<p id="timer-remaining"></p>
</section><p id="error" role="alert" hidden></p>
</main>
<script>
'use strict';
// Each sound uses one hue across the page, including the graph and native controls.
const presets=[
{id:'white',name:'White',swatch:'#ffffff',power:0,theme:{bg:'#f5f4f0',line:'#95958e',muted:'#64645e',ink:'#32332f',accent:'#52554e'}},
{id:'pink',name:'Pink',swatch:'#df829e',power:-1,theme:{bg:'#f4e5e7',line:'#ae868e',muted:'#805760',ink:'#532f39',accent:'#864759'}},
{id:'brown',name:'Brown',swatch:'#895b38',power:-2,theme:{bg:'#e9dccb',line:'#a3896d',muted:'#765b43',ink:'#4f3827',accent:'#795437'}},
{id:'blue',name:'Blue',swatch:'#4e98c6',power:1,theme:{bg:'#e3edf1',line:'#7e9eac',muted:'#4d6b7a',ink:'#2a4656',accent:'#3b6a82'}},
{id:'violet',name:'Violet',swatch:'#9569bd',power:2,theme:{bg:'#ece6f2',line:'#a191b3',muted:'#6f5d82',ink:'#483456',accent:'#72518b'}}
];
const $=id=>document.getElementById(id);let selected=presets[1],ctx,master,analyser,source,playing=false,busy=false,deadline=0;const buffers=new Map();
const playIcon='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l14-8z"/></svg>',pauseIcon='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
for(const p of presets){const b=document.createElement('button');b.className='color';b.dataset.id=p.id;b.style.setProperty('--swatch',p.swatch);b.setAttribute('aria-label',p.name+' noise');b.title=p.name+' noise';b.setAttribute('aria-pressed',String(p===selected));b.innerHTML=`<span class="swatch" aria-hidden="true"></span>`;b.onclick=()=>selectColor(p);document.querySelector('.colors').append(b)}
function selectColor(p){selected=p;for(const [role,color] of Object.entries(p.theme))document.documentElement.style.setProperty('--'+role,color);document.querySelector('meta[name="theme-color"]').content=p.theme.bg;document.querySelectorAll('.color').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===p.id)));$('spectrum').setAttribute('aria-label',p.name+' noise frequency spectrum');if(playing)startSource();draw()}
// A conjugate-symmetric random spectrum yields a real, periodic noise buffer.
// Power scales as f^power; amplitude scales as f^(power / 2).
function makeBuffer(p){const n=262144,buffer=ctx.createBuffer(2,n,ctx.sampleRate);for(let channel=0;channel<2;channel++){const re=new Float64Array(n),im=new Float64Array(n);for(let k=1;k<n/2;k++){const f=k*ctx.sampleRate/n;if(f<20)continue;const a=Math.pow(f/1000,p.power/2)*Math.sqrt(-2*Math.log(Math.max(Math.random(),1e-12)));const phase=Math.random()*Math.PI*2;re[k]=re[n-k]=a*Math.cos(phase);im[k]=a*Math.sin(phase);im[n-k]=-im[k]}
for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
for(let len=2;len<=n;len*=2){const angle=2*Math.PI/len,wr=Math.cos(angle),wi=Math.sin(angle);for(let i=0;i<n;i+=len){let ur=1,ui=0;for(let j=0;j<len/2;j++){const a=i+j,b=a+len/2,vr=re[b]*ur-im[b]*ui,vi=re[b]*ui+im[b]*ur;re[b]=re[a]-vr;im[b]=im[a]-vi;re[a]+=vr;im[a]+=vi;const next=ur*wr-ui*wi;ui=ur*wi+ui*wr;ur=next}}}
let peak=0;for(let i=0;i<n;i++)peak=Math.max(peak,Math.abs(re[i]));const data=buffer.getChannelData(channel);for(let i=0;i<n;i++)data[i]=re[i]/peak*.8}return buffer}
function startSource(){if(!buffers.has(selected.id))buffers.set(selected.id,makeBuffer(selected));const next=ctx.createBufferSource(),gain=ctx.createGain();next.buffer=buffers.get(selected.id);next.loop=true;next.connect(gain);gain.connect(master);const now=ctx.currentTime;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(1,now+.15);next.start();if(source){source.gain.gain.cancelScheduledValues(now);source.gain.gain.setTargetAtTime(0,now,.035);source.node.stop(now+.2)}next.onended=()=>{next.disconnect();gain.disconnect()};source={node:next,gain}}
function updatePlayback(){document.querySelector('.player').classList.toggle('playing',playing);$('play').innerHTML=playing?pauseIcon:playIcon;$('play').setAttribute('aria-label',playing?'Pause noise':'Play noise');$('play').setAttribute('aria-pressed',String(playing));$('status').textContent=playing?'Playing':'Paused';updateTimer();draw()}
function stop(){if(source){const now=ctx.currentTime;source.gain.gain.cancelScheduledValues(now);source.gain.gain.setTargetAtTime(0,now,.035);source.node.stop(now+.2);source=null}playing=false;deadline=0;updatePlayback()}
$('play').onclick=async()=>{if(busy)return;if(playing){stop();return}busy=true;$('play').disabled=true;$('error').hidden=true;try{if(!ctx){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error('Audio is not supported in this browser. Try a current version of Chrome, Firefox, or Safari.');ctx=new Audio();master=ctx.createGain();master.gain.value=Number($('volume').value)/100;analyser=ctx.createAnalyser();analyser.fftSize=2048;master.connect(analyser);analyser.connect(ctx.destination)}await ctx.resume();startSource();playing=true;resetTimer();updatePlayback()}catch(e){$('error').textContent=e.message||'Unable to start audio. Please try again.';$('error').hidden=false;playing=false}finally{busy=false;$('play').disabled=false}};
$('volume').oninput=()=>{const v=Number($('volume').value);$('volume-value').textContent=v+'%';if(master)master.gain.setTargetAtTime(v/100,ctx.currentTime,.04)};
function resetTimer(){deadline=playing&&Number($('timer').value)?Date.now()+Number($('timer').value)*60000:0;updateTimer()}
$('timer').onchange=resetTimer;
function updateTimer(){if(deadline){const secs=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer-remaining').textContent=`Stops in ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`}else $('timer-remaining').textContent=''}
setInterval(()=>{if(deadline&&Date.now()>=deadline){stop();$('status').textContent='Timer ended'}updateTimer()},500);
const canvas=$('spectrum'),paint=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let lastFrame=0;
const frequencyData=new Float32Array(1024);
function draw(){
const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
if(canvas.width!==Math.round(rect.width*dpr)||canvas.height!==Math.round(rect.height*dpr)){canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr)}
paint.setTransform(dpr,0,0,dpr,0,0);
const w=rect.width,h=rect.height;
paint.clearRect(0,0,w,h);
if(playing)analyser.getFloatFrequencyData(frequencyData);
paint.strokeStyle=selected.theme.accent;paint.lineWidth=1.5;paint.lineJoin='round';paint.beginPath();
for(let i=0;i<=160;i++){
const t=i/160,f=20*Math.pow(1000,t);
let y=h*.5-selected.power*(t-.5)*(h*.36);
if(playing){
const bin=Math.min(frequencyData.length-1,Math.max(1,Math.round(f*analyser.fftSize/ctx.sampleRate)));
const value=frequencyData[bin];
if(Number.isFinite(value))y=Math.max(12,Math.min(h-12,12+(-value-15)/90*(h-24)));
}
if(i===0)paint.moveTo(0,y);else paint.lineTo(t*w,y);
}
paint.stroke();
}
function frame(time){if(playing&&!document.hidden&&time-lastFrame>(reduced.matches?500:60)){draw();lastFrame=time}requestAnimationFrame(frame)}
requestAnimationFrame(frame);window.addEventListener('resize',draw);draw();
</script></body></html>
